name: iOS 15 compatibility check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record source identity
        run: |
          git fetch origin
          git merge-base --is-ancestor origin/main HEAD
          mkdir -p build/ios15-audit
          git rev-parse HEAD > build/ios15-audit/source.txt
          xcodebuild -version > build/ios15-audit/xcode.txt
      - name: Set experimental deployment targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Package.swift")
          s = p.read_text()
          assert ".iOS(.v17)" in s
          p.write_text(s.replace(".iOS(.v17)", '.iOS("15.6")'))
          p = Path("Scripts/build-apple-ffmpeg.sh")
          s = p.read_text()
          p.write_text(s.replace("arm64-apple-ios17.0", "arm64-apple-ios15.6"))
          PY
      - name: Prepare media dependency
        run: bash Scripts/build-apple-ffmpeg.sh 2>&1 | tee build/ios15-audit/ffmpeg.log
      - name: Compile core for iOS 15.6
        shell: bash
        run: |
          set -o pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build --triple arm64-apple-ios15.6 --sdk "$SDK" --target TVCore 2>&1 | tee build/ios15-audit/core.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios15-compatibility-diagnostics
          path: build/ios15-audit/
          if-no-files-found: error
